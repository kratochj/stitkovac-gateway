name: Validate gateway
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: python3 -m unittest discover -s deploy/systemd -p "test_*.py"
      - run: make check test arm64
      - run: sh scripts/package.sh 0.1.0-dev
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-arm64
          path: dist/*.deb

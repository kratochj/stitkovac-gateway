name: Validate gateway
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    # Netfilter integration needs native Netlink support, not user-mode QEMU.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: python3 -m unittest discover -s deploy/systemd -p "test_*.py"
      - run: python3 -m unittest discover -s scripts/image -p "test_*.py"
      - run: make VERSION=0.1.0 check test build arm64
      - run: sh scripts/test-network.sh
      - run: sh scripts/test-ota.sh
      - run: sh scripts/package.sh 0.1.0-dev
      - run: sh scripts/test-package.sh dist/stitkovac-gateway_0.1.0-dev_arm64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-arm64
          path: dist/*.deb

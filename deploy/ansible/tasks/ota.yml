---
- name: Require explicit signed release inputs
  ansible.builtin.assert:
    that:
      - gateway_ota_provision | default(false) | bool
      - ansible_facts.system == 'Linux'
      - ansible_facts.architecture == 'aarch64'
      - gateway_release_version is defined
      - gateway_release_version is match('^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$')
      - gateway_release_manifest is defined
      - gateway_release_artifact is defined
      - gateway_release_keys is defined
      - gateway_release_repository is match('^https://[a-zA-Z0-9.-]+(:[0-9]{1,5})?$')
    fail_msg: Supply the signed ARM64 release, public trust anchors and gateway_ota_provision=true from the local service console.

- name: Inspect running service
  ansible.builtin.command:
    argv: [systemctl, is-active, stitkovac-gateway]
  register: ota_service
  failed_when: false
  changed_when: false
  check_mode: false

- name: Require a stopped agent
  ansible.builtin.assert:
    that: ota_service.stdout | trim != 'active'
    fail_msg: Finish printing and stop the service before offline provisioning.

- name: Inspect persistent storage
  ansible.builtin.command:
    argv: [findmnt, --noheadings, --mountpoint, /data, --output, FSTYPE]
  register: ota_mount
  changed_when: false
  check_mode: false

- name: Require the persistent ext4 partition
  ansible.builtin.assert:
    that: ota_mount.stdout | trim == 'ext4'

- name: Install the stable supervisor and service tool
  ansible.builtin.copy:
    src: "{{ item.source }}"
    dest: "/usr/lib/stitkovac-gateway/{{ item.name }}"
    owner: root
    group: root
    mode: '0755'
  loop:
    - {source: "{{ gateway_launcher_binary }}", name: gateway-launcher}
    - {source: "{{ gateway_update_binary }}", name: gateway-update}

- name: Install matching platform recovery and diagnostics
  ansible.builtin.import_tasks: platform-health.yml

- name: Create private release storage
  ansible.builtin.file:
    path: /data/gateway-releases
    state: directory
    owner: stitkovac-gateway
    group: stitkovac-gateway
    mode: '0700'

- name: Stage and verify trust anchors and initial release
  when: not ansible_check_mode
  block:
    - name: Create temporary staging directory in RAM
      ansible.builtin.file:
        path: /run/stitkovac-ota-provision
        state: directory
        owner: stitkovac-gateway
        group: stitkovac-gateway
        mode: '0700'

    - name: Copy public anchors and signed inputs
      ansible.builtin.copy:
        src: "{{ item.source }}"
        dest: "/run/stitkovac-ota-provision/{{ item.name }}"
        owner: stitkovac-gateway
        group: stitkovac-gateway
        mode: '0600'
      loop:
        - {source: "{{ gateway_release_keys }}", name: keys.json}
        - {source: "{{ gateway_release_manifest }}", name: manifest.json}
        - {source: "{{ gateway_release_artifact }}", name: gateway}

    - name: Inspect existing release selection
      ansible.builtin.stat:
        path: /data/gateway-releases/selection.json
      register: ota_selection

    - name: Verify retained releases with the proposed trust anchors
      become_user: stitkovac-gateway
      ansible.builtin.command:
        argv: [/usr/lib/stitkovac-gateway/gateway-update, verify, --keys, /run/stitkovac-ota-provision/keys.json]
      changed_when: false
      when: ota_selection.stat.exists

    - name: Stage initial signed release without overwriting an existing version
      become_user: stitkovac-gateway
      ansible.builtin.command:
        argv:
          - /usr/lib/stitkovac-gateway/gateway-update
          - stage
          - --keys
          - /run/stitkovac-ota-provision/keys.json
          - --manifest
          - /run/stitkovac-ota-provision/manifest.json
          - --artifact
          - /run/stitkovac-ota-provision/gateway
        creates: "/data/gateway-releases/{{ gateway_release_version }}"

    - name: Verify the requested initial version
      become_user: stitkovac-gateway
      ansible.builtin.command:
        argv: [/usr/lib/stitkovac-gateway/gateway-update, verify, --keys, /run/stitkovac-ota-provision/keys.json, --version, "{{ gateway_release_version }}"]
      changed_when: false

    - name: Initialize selection without replacing an existing choice
      become_user: stitkovac-gateway
      ansible.builtin.command:
        argv: [/usr/lib/stitkovac-gateway/gateway-update, initialize, --keys, /run/stitkovac-ota-provision/keys.json, --version, "{{ gateway_release_version }}"]
        creates: /data/gateway-releases/selection.json

    - name: Install verified public trust anchors on the system partition
      ansible.builtin.copy:
        src: "{{ gateway_release_keys }}"
        dest: /etc/stitkovac-gateway/release-keys.json
        owner: root
        group: root
        mode: '0644'
  always:
    - name: Remove temporary provisioning files
      ansible.builtin.file:
        path: /run/stitkovac-ota-provision
        state: absent

- name: Create systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/stitkovac-gateway.service.d
    state: directory
    mode: '0755'

- name: Inspect an existing network override
  ansible.builtin.stat:
    path: /etc/systemd/system/stitkovac-gateway.service.d/network.conf
  register: ota_network_override

- name: Preserve the service AP argument from earlier network provisioning
  ansible.builtin.replace:
    path: /etc/systemd/system/stitkovac-gateway.service.d/network.conf
    regexp: '^ExecStart=/usr/lib/stitkovac-gateway/gateway serve --data-dir /data/gateway \$GATEWAY_ARGS --ap-admin-address ([0-9.]+:[0-9]+)$'
    replace: 'Environment="GATEWAY_NETWORK_ARGS=--ap-admin-address \1"\nExecStart=/usr/lib/stitkovac-gateway/gateway serve --data-dir /data/gateway $GATEWAY_ARGS $GATEWAY_NETWORK_ARGS'
  when: ota_network_override.stat.exists

- name: Enable signed launcher after any network override
  ansible.builtin.copy:
    dest: /etc/systemd/system/stitkovac-gateway.service.d/zz-ota.conf
    mode: '0644'
    content: |
      [Service]
      Environment="GATEWAY_OTA_REPOSITORY={{ gateway_release_repository }}"
      ExecStart=
      ExecStart=/usr/lib/stitkovac-gateway/gateway-launcher -- --data-dir /data/gateway $GATEWAY_ARGS $GATEWAY_NETWORK_ARGS --ota-repository ${GATEWAY_OTA_REPOSITORY}
      ReadWritePaths=/data/gateway-releases
      TimeoutStopSec=25

- name: Reload units without starting on writable root
  ansible.builtin.systemd_service:
    daemon_reload: true
    name: stitkovac-gateway
    enabled: true

- name: Report finalization requirement
  ansible.builtin.debug:
    msg: Restore read-only root and boot before starting. Verify the local health check and OTA capability in the server administration. Existing identity, cloud token and print journal were preserved.

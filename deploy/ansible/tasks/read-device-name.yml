---
- name: Validate device naming inputs
  ansible.builtin.assert:
    that:
      - gateway_wifi_interface is match('^[a-zA-Z0-9_-]{1,15}$')
      - gateway_naming_test_mac | default('') == '' or gateway_naming_test_mac is match('^([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}$')

- name: Resolve name from permanent Wi-Fi hardware address
  ansible.builtin.script:
    cmd: "{{ playbook_dir }}/files/device-name.py --interface {{ gateway_wifi_interface }} --test-mac '{{ gateway_naming_test_mac | default('') }}'"
    executable: /usr/bin/python3
  register: gateway_device_identity
  changed_when: false
  check_mode: false

- name: Retain the derived device name
  ansible.builtin.set_fact:
    gateway_device_name: "{{ (gateway_device_identity.stdout | from_json).name }}"

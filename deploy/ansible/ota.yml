---
# Run offline on a prepared appliance with writable root; restore read-only mounts before boot.
- name: Provision signed application OTA without changing identity or cloud credentials
  hosts: gateways
  become: true
  gather_facts: true
  vars:
    gateway_launcher_binary: "{{ playbook_dir }}/../../bin/gateway-launcher-linux-arm64"
    gateway_update_binary: "{{ playbook_dir }}/../../bin/gateway-update-linux-arm64"
    gateway_release_repository: https://cloud.stitkovac.app
  tasks:
    - name: Provision signed OTA
      ansible.builtin.import_tasks: tasks/ota.yml
